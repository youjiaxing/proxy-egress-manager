name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test native architecture
        run: |
          set -eu
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          core_image=$(.venv/bin/python -c 'import yaml; print(yaml.safe_load(open("compose.yaml"))["services"]["mihomo"]["image"])')
          docker pull "$core_image"
          core_container=$(docker create "$core_image")
          trap 'docker rm "$core_container"' EXIT
          docker cp "$core_container:/mihomo" /tmp/mihomo
          chmod 700 /tmp/mihomo
          MIHOMO_BIN=/tmp/mihomo .venv/bin/python -m pytest -q
          .venv/bin/python scripts/check_release.py
          node --check web/app.js
          npm install --prefix /tmp/pem-ui jsdom@26.1.0 --no-audit --no-fund
          JSDOM_PATH=/tmp/pem-ui/node_modules/jsdom node tests/ui_progress.cjs
          JSDOM_PATH=/tmp/pem-ui/node_modules/jsdom node tests/ui_group_help.cjs
      - name: Build and smoke-test image
        run: |
          docker build -t pem:ci .
          docker run --rm --entrypoint python pem:ci -c "from gateway.server import Gateway; from web.server import Management; import platform; print(platform.machine())"
      - name: Start actual Compose deployment
        run: bash scripts/compose_smoke.sh
